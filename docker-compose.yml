services:
  backend:
    build:
      context: ./backend
    container_name: smart-yield-backend
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: smart-yield-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
